name: Deploy to server

# ⛔ نُزع الإطلاق التلقائي.
#
# كان هذا السير يعمل عند كل push إلى main، فيتصل بالخادم وينفّذ
# git pull داخل /home/riyami-office/htdocs/office.riyami.om — مكتب
# الوالد، إنتاج حقيقي فيه بيانات حقيقية.
#
# ثلاثة أشياء تجعل ذلك خطراً لا مجرّد مفاجأة:
#   ١) لا نسخة احتياطية قبله.
#   ٢) لا migrate بعده — فيصير الكود الجديد فوق قاعدة قديمة، وهي
#      الحالة التي تُسقط الصفحات بخطأ ٥٠٠.
#   ٣) لا فحص نطاق محمي — القاعدة المعلنة أنّ مكتب الوالد لا يُلمس
#      إلا بطلب صريح منفصل، وهذا يلمسه بلا طلب أصلاً.
#
# ودمجُ فرع التطوير في main — وهو أطبع ما يُفعل عند «الانتهاء» —
# كان يكفي لإطلاقه.
#
# بقي workflow_dispatch وحده: يُشغَّل بيدٍ، عن قصد، ساعة يُراد.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ubuntu@${{ secrets.SSH_HOST }} '
            set -e
            sudo -u riyami-office bash -c "cd /home/riyami-office/htdocs/office.riyami.om && git pull"
            sudo -u riyami-office php /home/riyami-office/htdocs/office.riyami.om/artisan config:clear
            sudo -u riyami-office php /home/riyami-office/htdocs/office.riyami.om/artisan view:clear
            sudo -u riyami-office php /home/riyami-office/htdocs/office.riyami.om/artisan cache:clear
          '
